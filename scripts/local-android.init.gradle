// Bound Ninja concurrency as well as Gradle workers on this 16GB Windows PC.
allprojects {
    afterEvaluate { project ->
        def android = project.extensions.findByName("android")
        if (android != null) {
            android.defaultConfig.externalNativeBuild.cmake.arguments(
                "-DCMAKE_JOB_POOLS=leanlog_compile=2;leanlog_link=1",
                "-DCMAKE_JOB_POOL_COMPILE=leanlog_compile",
                "-DCMAKE_JOB_POOL_LINK=leanlog_link"
            )
        }
    }
}
